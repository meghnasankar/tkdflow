<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">TKDflow — taekwondo forms library</title>
  <desc id="d">TKDflow logo on a navy and dark red background with the text: Taekwondo forms library. Learn step by step. WT / Kukkiwon, ITF and ATA forms. tkdflow.com</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="0.55" stop-color="#1A2A3A"/>
      <stop offset="1" stop-color="#2D1218"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Simple stick-figure low block, echoing the lesson animation -->
  <g transform="translate(905 150)" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <line x1="60" y1="300" x2="160" y2="300" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <line x1="112" y1="168" x2="84" y2="230" stroke="#4A7FC1" stroke-width="9"/>
    <line x1="84" y1="230" x2="64" y2="294" stroke="#4A7FC1" stroke-width="8"/>
    <line x1="126" y1="168" x2="150" y2="244" stroke="#2A4F91" stroke-width="9"/>
    <line x1="150" y1="244" x2="160" y2="298" stroke="#2A4F91" stroke-width="8"/>
    <line x1="114" y1="60" x2="112" y2="168" stroke="#5A8AD0" stroke-width="10"/>
    <line x1="114" y1="60" x2="126" y2="168" stroke="#5A8AD0" stroke-width="10"/>
    <line x1="106" y1="138" x2="132" y2="138" stroke="#FFD700" stroke-width="5"/>
    <line x1="92" y1="72" x2="148" y2="74" stroke="#6A9ADF" stroke-width="7"/>
    <line x1="92" y1="72" x2="56" y2="112" stroke="#6AAAE0" stroke-width="9"/>
    <line x1="56" y1="112" x2="46" y2="164" stroke="#6AAAE0" stroke-width="8"/>
    <line x1="148" y1="74" x2="158" y2="112" stroke="#3A7AB0" stroke-width="9"/>
    <line x1="158" y1="112" x2="136" y2="120" stroke="#3A7AB0" stroke-width="8"/>
    <circle cx="46" cy="164" r="9" fill="#7ABBF0" stroke="none"/>
    <circle cx="136" cy="120" r="9" fill="#4A8BC0" stroke="none"/>
    <circle cx="117" cy="28" r="24" fill="#E3AE80" stroke="none"/>
  </g>

  <!-- Logo -->
  <rect x="88" y="96" width="104" height="104" rx="26" fill="#C8102E"/>
  <text x="140" y="172" text-anchor="middle" fill="#FFFFFF" font-size="62" font-weight="900"
        font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">道</text>
  <text x="222" y="170" fill="#FFFFFF" font-size="72" font-weight="900" letter-spacing="-1"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">TKDflow</text>
  <text x="560" y="166" fill="#FFFFFF" fill-opacity="0.6" font-size="28" font-weight="700"
        font-family="'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">태권도 플로우</text>

  <!-- Headline -->
  <text font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="64" letter-spacing="-1">
    <tspan x="88" y="312" fill="#FFFFFF">Taekwondo forms library.</tspan>
    <tspan x="88" y="392" fill="#FF6B81">Learn step by step.</tspan>
  </text>

  <!-- Styles covered -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">
    <rect x="88" y="446" width="226" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="201" y="479" text-anchor="middle">WT / Kukkiwon</text>
    <rect x="330" y="446" width="88" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="374" y="479" text-anchor="middle">ITF</text>
    <rect x="434" y="446" width="96" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="482" y="479" text-anchor="middle">ATA</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="574" width="1200" height="56" fill="#000000" fill-opacity="0.25"/>
  <rect x="88" y="598" width="40" height="6" rx="3" fill="#C8102E"/>
  <text x="142" y="609" fill="#FFFFFF" fill-opacity="0.85" font-size="24" font-weight="600"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">tkdflow.com</text>
</svg>
