# Release checks: layout sync, syntax, links, labels, metadata, claims,
# config/key safety, headers, contrast, logic, auth flows, preview-server
# safety and database policies (embedded Postgres). Read-only permissions.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs (immutable); the comment names the release. Sources: the action's release page,
      # action.yml and README at that commit (both actions run on node24 and need Actions Runner v2.327.1 or later).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
